name: Deploy hello-lambda

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Image tag to deploy (defaults to the commit SHA)'
        required: false
        default: ''

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-west-2

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    outputs:
      image_uri: ${{ steps.image_uri.outputs.image_uri }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials (ECR)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_ECR }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Setup Docker buildx
        uses: docker/setup-buildx-action@v3

      - name: Compute image tags
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPO }}
          tags: |
            type=raw,value=${{ github.sha }}
            type=sha,format=short

      - name: Build and push
        id: image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.metadata.outputs.tags }}
          platforms: linux/arm64
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false

      - name: Export image URI
        id: image_uri
        run: |
          echo "image_uri=${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPO }}:${{ github.sha }}" >> "$GITHUB_OUTPUT"

      - name: Scan image with Docker Scout
        uses: docker/scout-action@v1
        continue-on-error: true
        with:
          command: cves
          image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPO }}:${{ github.sha }}
          only-severities: critical,high
          exit-code: true

  deploy:
    needs: build
    runs-on: ubuntu-24.04-arm
    strategy:
      matrix:
        function: [hello-lambda]
    steps:
      - name: Configure AWS credentials (Lambda)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_TO_ASSUME_LAMBDAS }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Update Lambda function code
        run: |
          aws lambda update-function-code \
            --function-name ${{ matrix.function }} \
            --image-uri ${{ needs.build.outputs.image_uri }}

      - name: Wait for update to finish
        run: |
          aws lambda wait function-updated \
            --function-name ${{ matrix.function }}
